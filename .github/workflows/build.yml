name: NOX DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Ortam bilgisi
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Derle ve .app paketle
        run: |
          set -euo pipefail
          swift build -c release
          BIN=$(swift build -c release --show-bin-path)
          APP="dist/NOX.app"
          rm -rf dist
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN/NOX" "$APP/Contents/MacOS/NOX"
          cp Support/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: DMG oluştur
        run: |
          set -euo pipefail
          rm -rf dmgroot
          mkdir -p dmgroot
          cp -R dist/NOX.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "NOX" -srcfolder dmgroot -ov -format UDZO dist/NOX.dmg
          shasum -a 256 dist/NOX.dmg

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: NOX-dmg
          path: dist/NOX.dmg
          if-no-files-found: error

      - name: Etiketliyse Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NOX.dmg
